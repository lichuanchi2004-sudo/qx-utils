[MITM]
# 只需解密主站；不要写 *.newyorker.com（会把图片 CDN media.newyorker.com 拉进解密，导致配图加载不全）
hostname = newyorker.com, www.newyorker.com

[rewrite_local]
# ------- 纽约客 软墙解锁（本机脚本，不依赖任何第三方）-------
# 机制：全文就在 HTML 里，只是盖了 paywall 浮层 + 用 CSS 把正文下半截压住，
#       并按本机 cookie/localStorage 的计量计数决定压不压。
# 打法：保留页面自身脚本（水合靠它，删了正文就没了），只注入
#       ① CSS 掀掉 paywall 浮层、解除正文高度/遮罩压制
#       ② JS 清掉本机计量状态，让付费墙脚本按"未计量"放行
# 真实页面 class 已核对：paywall / paywall-modal / paywall-bar / PaywallModalWrapper /
#   PaywallBarWrapper / consumer-marketing-unit__slot--paywall-* ；
#   正文容器：article__body / body__container / body__inner-container / BodyWrapper-*
^https?:\/\/(www\.)?newyorker\.com\/\S+ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/reader.js
