[MITM]
# newyorker.com 需要解密才能触发下面的 302；r.jina.ai 必须解密才能把 Markdown 转成阅读页。
# 注意：不要写 *.newyorker.com —— 会把图片 CDN(media.newyorker.com) 一起拉进解密导致图加载不全。
hostname = newyorker.com, www.newyorker.com, r.jina.ai

[rewrite_local]
# ------- 纽约客 -------
# 实测结论（2026-10-14 本机验证）：
#   纽约客【不按 UA 差异化下发】——普通 UA 与 Googlebot UA 返回的字节数完全一致(826398)，
#   改 UA 拿不到更多内容；它看的是你本机的 cookie/计量状态，你设备已被计满，所以只给一段。
#   因此改走"换身份"路线：把文章请求 302 给 jina，由它用全新爬虫身份回源取全文。

# ① 文章页 → jina 代理（只匹配文章路径，路径段不含点，天然避开 js/css/图片等静态资源）
^(https?:\/\/(?:www\.)?newyorker\.com\/(?:magazine|news|culture|books|humor|tech|science|business|video|podcast)(?:\/[^\/\?.]*)+(?:\?[^\s]*)?)$ url 302 https://r.jina.ai/$1

# ② 把 jina 返回的 Markdown 渲染成排版良好的阅读页（浅色、大字、可 AA 翻译）
^https?:\/\/r\.jina\.ai\/https?:\/\/(?:www\.)?newyorker\.com\/\S+ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/ny_md2html.js
