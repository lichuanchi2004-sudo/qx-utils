[MITM]
hostname = newyorker.com, www.newyorker.com, theatlantic.com, www.theatlantic.com

[rewrite_local]
# 纽约客：软墙，本机脚本解锁（注入 CSS 掀浮层/解截断 + 清本机计量状态），保留页面自身脚本
^https?:\/\/(www\.)?newyorker\.com\/\S+ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/reader.js
# 大西洋：软墙，注入「强制显示全文」CSS + 移除付费墙脚本（同步，无网络请求，不依赖 jina）
^https?:\/\/(www\.)?theatlantic\.com\/(?:[a-z]+\/)*\d{4}\/\d{2}\/\S+ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_reader.js
# 大西洋：首页/栏目页只还原懒加载图片、保留页面自身脚本（避免删脚本导致首页图加载不全）
^https?:\/\/(www\.)?theatlantic\.com\/(?:[a-z-]+\/)*(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_home.js
