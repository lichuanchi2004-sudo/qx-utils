# ============================================================
# Quantumult X 网页全文阅读辅助 —— 单文件配置片段
# ------------------------------------------------------------
# 本片段含 [MITM] 与 [rewrite_local] 两段，可合并进你的 QX 主配置，
# 或作为「远程配置」单独订阅（不会覆盖你现有配置）。
# 合并 / 订阅后，QX 会自动拉取并缓存下方引用的 reader.js，无需再单独添加脚本。
# ============================================================

[MITM]
hostname = newyorker.com, www.newyorker.com

[rewrite_local]
^https?:\/\/(www\.)?newyorker\.com\/.* url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/reader.js
