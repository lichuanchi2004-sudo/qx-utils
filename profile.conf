[MITM]
hostname = newyorker.com, www.newyorker.com, *.theatlantic.com, theatlantic.com

[rewrite_local]
# 纽约客：软墙，注入样式隐藏遮罩、解除截断
^https?:\/\/(www\.)?newyorker\.com\/.* url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/reader.js
# 大西洋：软墙，注入「强制显示全文」CSS + 移除付费墙脚本（同步，无网络请求，不依赖 jina）
^https?:\/\/(www\.)?theatlantic\.com\/(?:[a-z]+\/)*\d{4}\/\d{2}\/\S+ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_reader.js
