[rewrite_local]
# ===== 纽约客 全文解锁（纯重写规则，一条搞定，不含 [MITM]）=====
#
# 前提：在主配置 [MITM] 的 hostname 里填：
#   newyorker.com, www.newyorker.com
#  （不要写 *.newyorker.com —— 会把 media.newyorker.com 图片 CDN 拉进解密，配图会变慢/变灰）
#
# 原理（实测，见 reader.js 顶部注释）：
#   服务端本来就下发全文，正文段落带 class="paywall"（只是标记，本身不隐藏）；
#   真正的隐藏是客户端 JS 水合后按 paragraphLimit:1 把正文容器清空。
#   所以这里删掉页面脚本、阻断水合，再补一段只隐藏"付费墙外壳"的 CSS。
#
# 只需这一条。原先那条 ny_headers.js（改请求头换身份）已不需要，删掉即可。

^https?:\/\/(www\.)?newyorker\.com\/ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/reader.js
