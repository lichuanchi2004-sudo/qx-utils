[rewrite_local]
# ===== 纽约客 解锁（纯重写规则，不含 [MITM]）=====
# 前提：你自己在主配置 [MITM] 的 hostname 里填：
#   newyorker.com, www.newyorker.com
#  （不要写 *.newyorker.com —— 会把图片 CDN media.newyorker.com 拉进解密，导致配图加载不全）
#
# 打法（两步，都基于真机实测）：
#   ① 请求阶段：剔除 Condé Nast 的身份 cookie（CN_xid 等），让服务端按"新访客"下发全文。
#      实测：全新身份请求同一批文章拿到全文（125 段/4650 词、14 段/2995 词…）；
#      而你设备的 CN_xid 已被计满，服务端只给首段。
#   ② 响应阶段：注入 CSS 掀掉付费墙遮罩、解除正文高度/渐变压制（保留页面全部脚本）。

# ① 请求头处理（换新身份，拿全文）
^https?:\/\/(www\.)?newyorker\.com\/.* url script-request-header https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/ny_headers.js

# ② 响应体处理（掀遮罩 + 解截断）
^https?:\/\/(www\.)?newyorker\.com\/.* url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/reader.js
