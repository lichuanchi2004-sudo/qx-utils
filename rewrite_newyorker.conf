[rewrite_local]
# 纽约客 —— 一条规则搞定（纯重写，不含 [MITM]，用「重写规则」类型订阅不会 invalid line）
# 前提：主配置 [MITM] 的 hostname 里要有 newyorker.com, www.newyorker.com
#      （不要写 *.newyorker.com，会把图片 CDN media.newyorker.com 拉进解密导致配图加载不全）
^https?:\/\/(www\.)?newyorker\.com\/.* url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/reader.js
