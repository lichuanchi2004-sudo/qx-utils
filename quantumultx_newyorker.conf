# ============================================================
# Quantumult X 一键解锁《纽约客》(The New Yorker) 全文 —— 单文件版
# ------------------------------------------------------------
# 一键写入（在 iPhone 上点这个链接即可，会自动写入重写 + MitM）：
#   quantumult-x:///setup-configuration?remote-url=https%3A%2F%2Fraw.githubusercontent.com%2Flichuanchi2004-sudo%2Fnewyorker-qx-unlock%2Fmain%2Fquantumultx_newyorker.conf
# 若直链未自动唤起 QX，可手动：QX → 配置文件 → 远程配置 → 右上角 + →
#   粘贴下面这个 raw 地址 → 下载 → 勾选「重写 / MitM」→ 完成：
#   https://raw.githubusercontent.com/lichuanchi2004-sudo/newyorker-qx-unlock/main/quantumultx_newyorker.conf
# 导入后 QX 会自动拉取并缓存下方引用的 newyorker.js，无需再单独添加脚本。
# ============================================================

[MITM]
hostname = newyorker.com, www.newyorker.com

[rewrite_local]
^https?:\/\/(www\.)?newyorker\.com\/.* url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/newyorker-qx-unlock/main/newyorker.js
