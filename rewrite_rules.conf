[rewrite_local]
# 纯重写规则文件（不含 [MITM]，请用「重写规则」类型订阅，不会 invalid line）
# 注意：MITM 需在你主配置里手写：
#   hostname = newyorker.com, www.newyorker.com, theatlantic.com, www.theatlantic.com
# （绝不要写 *.theatlantic.com —— 会把图片 CDN 也拉进 MITM，导致图片加载不全）

# ===== 纽约客 =====
# 实测：纽约客不认 UA 伪装（普通 UA 与 Googlebot UA 返回字节数一致），改 UA 无效。
# 它的付费墙按「本机 cookie/计量状态」下发：你设备计满 → 服务端只给一段。
# 解法＝换身份取全文：把文章请求 302 给 jina，由它的爬虫回源。

# ① 文章页 → jina 代理（只匹配文章路径；路径段不含点，自动避开 js/css/图片）
^(https?:\/\/(?:www\.)?newyorker\.com\/(?:magazine|news|culture|books|humor|tech|science|business|video|podcast)(?:\/[^\/\?.]*)+(?:\?[^\s]*)?)$ url 302 https://r.jina.ai/$1

# ② Markdown → 干净阅读页
^https?:\/\/r\.jina\.ai\/https?:\/\/(?:www\.)?newyorker\.com\/\S+ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/ny_md2html.js

# 大西洋 文章页（路径含 年/月）：删全部脚本保住 SSR 全文
# 与下面首页规则互补，两条互不重叠：本条只匹配含日期的文章链接
^https?:\/\/(www\.)?theatlantic\.com\/(?:[a-z]+\/)*\d{4}\/\d{2}\/\S+ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_reader.js

# 大西洋 首页/栏目页（无日期路径）：只还原懒加载图片，保留页面自己的脚本
# ⚠️ 关键：首页绝不能套用「删全部脚本」——那会杀掉页面自身的图片懒加载器，导致首页图加载不全
^https?:\/\/(www\.)?theatlantic\.com\/(?:[a-z-]+\/)*(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_home.js
