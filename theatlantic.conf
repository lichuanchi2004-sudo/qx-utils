[rewrite_local]
# The Atlantic 为「服务端截断」硬墙：把文章请求重定向到 r.jina.ai 全文代理
^https?:\/\/(www\.)?theatlantic\.com\/[a-z]+\/\d{4}\/\d{2}\/[a-z0-9\-]+\/\d+ url 302 https://r.jina.ai/$0
# 把 r.jina.ai 返回的全文(markdown) 转为可阅读 HTML
^https?:\/\/r\.jina\.ai\/https?:\/\/(www\.)?theatlantic\.com\/.* url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_md2html.js
