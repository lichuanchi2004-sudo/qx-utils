[MITM]
hostname = theatlantic.com, www.theatlantic.com

[rewrite_local]
# The Atlantic 软墙：全文其实就在下发的 HTML 里，付费墙脚本/遮罩在加载后才把下半部分
# 遮挡或截断（典型表现：刷新瞬间看到全文，随即变回截断页）。
# 本方案用一条【纯同步】script-response-body 注入「强制显示全文」CSS 并移除付费墙脚本，
# 不依赖任何第三方代理（r.jina.ai 实测不稳定，已弃用）。
#
# ⚠️ 必须用「配置文件」类型订阅本文件（不要选「重写规则」）：
#    这样上面的 [MITM] 主机名才会自动并入你的配置；否则 QX 在 HTTPS 下看不到 URL 路径，
#    规则永不触发，仍会显示原截断页。

# 文章页（路径含 年/月）：删全部脚本保住 SSR 全文（同步，无网络请求）
^https?:\/\/(www\.)?theatlantic\.com\/(?:[a-z]+\/)*\d{4}\/\d{2}\/\S+ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_reader.js

# 首页/栏目页（无日期路径）：只还原懒加载图片，保留页面自身脚本
# ⚠️ 首页不能套用「删全部脚本」，否则会杀掉页面自己的图片懒加载器 → 首页图片加载不全
^https?:\/\/(www\.)?theatlantic\.com\/(?:[a-z-]+\/)*(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_home.js
