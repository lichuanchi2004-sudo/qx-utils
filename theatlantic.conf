[MITM]
hostname = theatlantic.com, www.theatlantic.com, r.jina.ai

[rewrite_local]
# The Atlantic 为「服务端截断」硬墙：网页 HTML 里只有前几百词，print/AMP 同源也被砍。
# 本方案不依赖脚本内异步网络（你这版 QX 的 script-response-body 不等异步回调），
# 改用 QX 原生「url 302」把文章页重定向到 r.jina.ai 抓全文，
# 再用一条【纯同步】脚本把 jina 返回的 markdown 转成排版 HTML。
#
# ⚠️ 必须用「配置文件」类型订阅本文件（不要选「重写规则」）：
#    只有这样，上面的 [MITM] 主机名才会自动并入你的配置。
#    否则 QX 在 HTTPS 下看不到 URL 路径，302 规则永不触发，仍会显示原截断页。
#    （已实测 r.jina.ai 对大西洋文章返回 1300+ 词全文，解析脚本对得上。）

# 1) 文章页请求重定向到 jina 全文代理
^(https?:\/\/(www\.)?theatlantic\.com\/(?:[a-z]+\/)*\d{4}\/\d{2}\/\S+)$ url 302 https://r.jina.ai/$1

# 2) jina 返回的 markdown 同步转 HTML
^https?:\/\/r\.jina\.ai\/https?:\/\/(www\.)?theatlantic\.com\/.* script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/atl_md2html.js
