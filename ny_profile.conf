# The New Yorker 解锁 —— 一条链接搞定（QX 里订阅时类型必须选「配置文件」）
# 为什么要用「配置文件」类型：只有它才会把下面的 [MITM] hostname 自动并入你的配置。
# 用「重写规则」类型订阅不会读 [MITM]，HTTPS 下 QX 不解密就看不到 URL，脚本一条都不会跑。
# 本文件只含纽约客，不含大西洋，不会干扰你已有的任何配置。

[MITM]
hostname = newyorker.com, www.newyorker.com

[rewrite_local]
^https?:\/\/(www\.)?newyorker\.com\/.* url script-response-body https://raw.githubusercontent.com/lichuanchi2004-sudo/qx-utils/main/reader.js
